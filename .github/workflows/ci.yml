name: Build and test

on:
  pull_request:
    branches: [dev, main, mobile]
  push:
    branches: [dev, main, mobile]

permissions:
  contents: read

jobs:
  frontend:
    if: github.ref_name != 'mobile' && github.base_ref != 'mobile'
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build Next.js application
        run: npm run build
        working-directory: frontend

  backend:
    if: github.ref_name != 'mobile' && github.base_ref != 'mobile'
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        run: npm install
        working-directory: backend
      - name: Compile Node API
        run: npm run build
        working-directory: backend
      - name: Run backend tests
        run: npm test -- --passWithNoTests
        working-directory: backend

  mobile:
    if: github.ref_name == 'mobile' || github.head_ref == 'mobile'
    name: Mobile typecheck and Android bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
        working-directory: mobile
      - name: TypeScript check
        run: npm run typecheck
        working-directory: mobile
      - name: Validate Expo configuration
        run: npx expo-doctor
        working-directory: mobile
      - name: Export Android bundle
        run: npx expo export --platform android
        working-directory: mobile
